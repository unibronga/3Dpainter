# Сборка установщика. Значок берётся из build/icon.png — его рисует
# scripts/make-icon.mjs, поэтому отдельно класть картинку не нужно.

appId: ru.lowpoly.painter3d
productName: 3DPainter
copyright: 3DPainter — ручная покраска low-poly моделей

directories:
  output: release
  buildResources: build

# Кладём в приложение только собранную страницу и оболочку: исходники и
# библиотеки Vite уже вшил в dist, тянуть их второй раз незачем.
files:
  - dist/**/*
  - electron/**/*
  - package.json

# Нативных модулей нет — пересобирать нечего.
npmRebuild: false

mac:
  category: public.app-category.graphics-design
  # Сертификата разработчика нет, подпись отключаем явно: иначе сборка
  # падает на попытке найти ключ в связке.
  identity: null
  target:
    - dmg
    - zip

dmg:
  title: 3DPainter
  artifactName: 3DPainter-${version}-${arch}.dmg

win:
  target:
    - nsis      # обычный установщик
    - zip       # распаковал и запустил, без установки
  artifactName: 3DPainter-${version}-${arch}.${ext}

nsis:
  # Установщик с окном, а не молчаливый: пусть человек сам выберет папку.
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 3DPainter

linux:
  target: AppImage
  category: Graphics
  artifactName: 3DPainter-${version}-${arch}.${ext}
